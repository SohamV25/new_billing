<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Awaiting Activation | Stitch Billing</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              secondary: "#adc7ff",
              "tertiary-fixed-dim": "#a7d0b3",
              "on-tertiary-container": "#274c36",
              "surface-container-high": "#2a2a2b",
              surface: "#131314",
              "tertiary-container": "#94bca0",
              "on-secondary-fixed-variant": "#004493",
              "surface-container-lowest": "#0e0e0f",
              "on-primary-container": "#0d4582",
              "surface-container": "#201f20",
              "outline-variant": "#424750",
              "secondary-container": "#026be0",
              "primary-fixed-dim": "#a8c8ff",
              background: "#131314",
              "on-primary-fixed-variant": "#114784",
              "inverse-on-surface": "#313031",
              "on-secondary-container": "#f2f4ff",
              "on-primary-fixed": "#001b3c",
              "surface-container-highest": "#353436",
              "on-primary": "#003061",
              "secondary-fixed-dim": "#adc7ff",
              "on-surface": "#e5e2e3",
              "on-error": "#690005",
              "tertiary-fixed": "#c3edcf",
              "primary-container": "#8ab4f8",
              "surface-container-low": "#1c1b1c",
              "on-error-container": "#ffdad6",
              "inverse-primary": "#315f9d",
              "on-secondary-fixed": "#001a41",
              "error-container": "#93000a",
              tertiary: "#afd8bb",
              "primary-fixed": "#d5e3ff",
              "surface-tint": "#a8c8ff",
              "surface-bright": "#39393a",
              "secondary-fixed": "#d8e2ff",
              "surface-variant": "#353436",
              outline: "#8d919b",
              error: "#ffb4ab",
              "on-tertiary-fixed-variant": "#294e38",
              "surface-dim": "#131314",
              "on-secondary": "#002e68",
              "on-surface-variant": "#c3c6d1",
              "on-tertiary": "#113723",
              "inverse-surface": "#e5e2e3",
              primary: "#b5cfff",
              "on-background": "#e5e2e3",
              "on-tertiary-fixed": "#002110",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              unit: "4px",
              "container-padding": "24px",
              "margin-mobile": "16px",
              "margin-desktop": "32px",
              gutter: "16px",
            },
            fontFamily: {
              "body-md": ["Inter"],
              "headline-md": ["Inter"],
              "label-md": ["Geist"],
              "headline-sm": ["Inter"],
              "body-lg": ["Inter"],
              "mono-sm": ["Geist"],
              "headline-lg": ["Inter"],
            },
            fontSize: {
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-md": [
                "24px",
                {
                  lineHeight: "32px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.02em",
                  fontWeight: "500",
                },
              ],
              "headline-sm": [
                "20px",
                { lineHeight: "28px", fontWeight: "500" },
              ],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "mono-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.02em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #131314;
        color: #e5e2e3;
        -webkit-font-smoothing: antialiased;
      }
      .glow-blue {
        filter: drop-shadow(0 0 12px rgba(138, 180, 248, 0.4));
      }
      .glass-card {
        background: rgba(30, 31, 34, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid #2d2f34;
      }
      @keyframes pulse-soft {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(0.98);
        }
      }
      .animate-pulse-soft {
        animation: pulse-soft 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="font-body-md text-body-md flex min-h-screen flex-col items-center justify-center overflow-hidden"
  >
    <!-- Atmospheric Background Element -->
    <div class="pointer-events-none fixed inset-0 z-0 opacity-30">
      <div
        class="bg-primary-container absolute top-[-10%] left-[-10%] h-[40%] w-[40%] rounded-full blur-[120px]"
      ></div>
      <div
        class="bg-secondary-container absolute right-[-5%] bottom-[-5%] h-[30%] w-[30%] rounded-full blur-[100px]"
      ></div>
    </div>
    <!-- Top App Bar (Simplified for transactional screen) -->
    <header
      class="px-margin-mobile fixed top-0 z-50 flex h-16 w-full items-center justify-between"
    >
      <div
        class="font-headline-md text-headline-md text-on-surface font-bold tracking-tight"
      >
        Stitch Billing
      </div>
      <div
        class="bg-surface-container-highest border-outline-variant flex h-8 w-8 items-center justify-center rounded-full border"
      >
        <span
          class="material-symbols-outlined text-on-surface-variant text-[18px]"
          >person</span
        >
      </div>
    </header>
    <!-- Main Content Canvas -->
    <main
      class="px-margin-mobile relative z-10 flex w-full max-w-[400px] flex-col items-center text-center"
    >
      <!-- Icon Container -->
      <div class="group relative mb-8">
        <div
          class="bg-primary-container/10 group-hover:bg-primary-container/20 absolute -inset-4 rounded-full blur-2xl transition-all duration-1000"
        ></div>
        <div
          class="bg-surface-container-high border-outline-variant glow-blue animate-pulse-soft relative flex h-24 w-24 items-center justify-center rounded-full border"
        >
          <span
            class="material-symbols-outlined text-primary-container text-[48px]"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >hourglass_empty</span
          >
        </div>
        <!-- Secondary lock icon overlay for context -->
        <div
          class="bg-surface border-outline-variant absolute -right-1 -bottom-1 flex h-8 w-8 items-center justify-center rounded-lg border shadow-lg"
        >
          <span class="material-symbols-outlined text-secondary text-[16px]"
            >lock</span
          >
        </div>
      </div>
      <!-- Typography Section -->
      <h1
        class="font-headline-lg text-headline-lg text-on-surface mb-3 tracking-tight"
      >
        Awaiting Activation
      </h1>
      <p
        class="font-body-lg text-body-lg text-on-surface-variant mb-10 max-w-[320px] leading-relaxed"
      >
        Your billing environment is currently being provisioned. This process
        usually takes less than 15 minutes to secure your keys.
      </p>
      <!-- Actions Container -->
      <div class="w-full space-y-4">
        <!-- Primary Action -->
        <button
          class="bg-primary-container text-on-primary-container font-label-md text-label-md flex h-12 w-full items-center justify-center gap-2 rounded-lg font-bold transition-all hover:brightness-110 active:scale-[0.98]"
        >
          <span class="material-symbols-outlined text-[20px]"
            >support_agent</span
          >
          Contact Support
        </button>
        <!-- Secondary Action -->
        <button
          class="text-secondary border-outline-variant font-label-md text-label-md hover:bg-surface-variant flex h-12 w-full items-center justify-center gap-2 rounded-lg border bg-transparent font-medium transition-all active:scale-[0.98]"
        >
          <span class="material-symbols-outlined text-[20px]">logout</span>
          Sign Out
        </button>
      </div>
      <!-- Status Card (Bento Style) -->
      <div class="glass-card mt-12 flex w-full flex-col gap-3 rounded-xl p-4">
        <div class="flex items-center justify-between">
          <span
            class="font-mono-sm text-mono-sm text-on-surface-variant tracking-widest uppercase opacity-60"
            >Status</span
          >
          <div
            class="bg-secondary-container/20 border-secondary-container/30 flex items-center gap-1.5 rounded-full border px-2 py-0.5"
          >
            <span
              class="bg-secondary h-1.5 w-1.5 animate-pulse rounded-full"
            ></span>
            <span class="font-mono-sm text-mono-sm text-secondary"
              >Pending</span
            >
          </div>
        </div>
        <div
          class="bg-surface-container-highest h-1 overflow-hidden rounded-full"
        >
          <div
            class="bg-primary-container h-full w-[65%] transition-all duration-1000"
            id="progress-bar"
          ></div>
        </div>
        <div
          class="font-mono-sm text-mono-sm text-on-surface-variant flex justify-between opacity-80"
        >
          <span>Identity Verified</span>
          <span>Deploying Shards</span>
        </div>
      </div>
    </main>
    <!-- Footer Security Note -->
    <footer class="px-margin-mobile fixed bottom-8 w-full text-center">
      <div class="flex items-center justify-center gap-2 opacity-40">
        <span class="material-symbols-outlined text-[14px]">verified_user</span>
        <span class="font-label-md text-label-md tracking-[0.1em] uppercase"
          >Encrypted Session Protocol 2.4</span
        >
      </div>
    </footer>
    <script>
      // Micro-interaction: Progress bar simulation
      const progressBar = document.getElementById("progress-bar");
      let width = 65;
      const interval = setInterval(() => {
        if (width >= 92) {
          clearInterval(interval);
        } else {
          width += Math.random() * 0.5;
          progressBar.style.width = width + "%";
        }
      }, 3000);

      // Micro-interaction: Smooth hover for buttons
      document.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("touchstart", () => {
          btn.style.transform = "scale(0.96)";
        });
        btn.addEventListener("touchend", () => {
          btn.style.transform = "scale(1)";
        });
      });
    </script>
  </body>
</html>
