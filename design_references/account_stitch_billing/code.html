<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Stitch Billing - Account Settings</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              secondary: "#adc7ff",
              "tertiary-fixed-dim": "#a7d0b3",
              "on-tertiary-container": "#274c36",
              "surface-container-high": "#2a2a2b",
              surface: "#131314",
              "tertiary-container": "#94bca0",
              "on-secondary-fixed-variant": "#004493",
              "surface-container-lowest": "#0e0e0f",
              "on-primary-container": "#0d4582",
              "surface-container": "#201f20",
              "outline-variant": "#424750",
              "secondary-container": "#026be0",
              "primary-fixed-dim": "#a8c8ff",
              background: "#131314",
              "on-primary-fixed-variant": "#114784",
              "inverse-on-surface": "#313031",
              "on-secondary-container": "#f2f4ff",
              "on-primary-fixed": "#001b3c",
              "surface-container-highest": "#353436",
              "on-primary": "#003061",
              "secondary-fixed-dim": "#adc7ff",
              "on-surface": "#e5e2e3",
              "on-error": "#690005",
              "tertiary-fixed": "#c3edcf",
              "primary-container": "#8ab4f8",
              "surface-container-low": "#1c1b1c",
              "on-error-container": "#ffdad6",
              "inverse-primary": "#315f9d",
              "on-secondary-fixed": "#001a41",
              "error-container": "#93000a",
              tertiary: "#afd8bb",
              "primary-fixed": "#d5e3ff",
              "surface-tint": "#a8c8ff",
              "surface-bright": "#39393a",
              "secondary-fixed": "#d8e2ff",
              "surface-variant": "#353436",
              outline: "#8d919b",
              error: "#ffb4ab",
              "on-tertiary-fixed-variant": "#294e38",
              "surface-dim": "#131314",
              "on-secondary": "#002e68",
              "on-surface-variant": "#c3c6d1",
              "on-tertiary": "#113723",
              "inverse-surface": "#e5e2e3",
              primary: "#b5cfff",
              "on-background": "#e5e2e3",
              "on-tertiary-fixed": "#002110",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              unit: "4px",
              "container-padding": "24px",
              "margin-mobile": "16px",
              "margin-desktop": "32px",
              gutter: "16px",
            },
            fontFamily: {
              "body-md": ["Inter"],
              "headline-md": ["Inter"],
              "label-md": ["Geist"],
              "headline-sm": ["Inter"],
              "body-lg": ["Inter"],
              "mono-sm": ["Geist"],
              "headline-lg": ["Inter"],
            },
            fontSize: {
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-md": [
                "24px",
                {
                  lineHeight: "32px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.02em",
                  fontWeight: "500",
                },
              ],
              "headline-sm": [
                "20px",
                { lineHeight: "28px", fontWeight: "500" },
              ],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "mono-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.02em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        display: inline-block;
        vertical-align: middle;
      }
      body {
        background-color: #131314;
        color: #e5e2e3;
        -webkit-font-smoothing: antialiased;
      }
      .settings-card {
        background-color: #1e1f22;
        border: 1px solid #2d2f34;
      }
      .active-nav-indicator {
        position: absolute;
        bottom: 0;
        width: 24px;
        height: 3px;
        border-radius: 3px 3px 0 0;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="font-body-md text-body-md pb-20 antialiased">
    <!-- TopAppBar -->
    <header
      class="bg-surface px-margin-mobile border-outline-variant fixed top-0 z-50 flex h-16 w-full items-center justify-between border-b"
    >
      <h1 class="font-headline-md text-headline-md text-on-surface">
        Stitch Billing
      </h1>
      <div class="flex items-center gap-4">
        <button
          class="material-symbols-outlined text-primary hover:bg-surface-variant rounded-full p-2 transition-colors duration-200"
        >
          notifications
        </button>
        <div class="border-outline h-8 w-8 overflow-hidden rounded-full border">
          <img
            class="h-full w-full object-cover"
            data-alt="A professional studio portrait of a technology executive in a dark environment. The lighting is dramatic and moody, with high contrast highlighting facial features against a deep, level-0 black background. The overall aesthetic is sleek and corporate minimalist, using a cool blue-toned color palette consistent with a technical dark mode interface."
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAPQa_twKUZLTrjaam-nWwHYZ7v07WikVQyub-RFMOuBtYEb4zu-g9yUqjabx5qN6sfV2lDwa4IkxbSQk-M5zKYgkI0sZOBJ_ug5Lklk_2mFIGGwPBAEOG7bORM_jndjYS5d21hDeK3sRAX2ZP1pm92EI2PMeh4Lpqv1oIRoO-zimCAtDkcD5GB9wVTmuANubTUod_CdL0rF871j2VPO6ZxVJ1FGKiEXf9IKU8mzX-uFgUZjOF3BR4yqQ"
          />
        </div>
      </div>
    </header>
    <!-- Main Content Canvas -->
    <main class="px-margin-mobile flex flex-col gap-6 pt-20">
      <!-- Profile Header Section -->
      <section class="flex flex-col items-center gap-3 py-6">
        <div class="relative">
          <div
            class="border-surface-container h-24 w-24 overflow-hidden rounded-full border-4"
          >
            <img
              class="h-full w-full object-cover"
              data-alt="A close-up high-resolution profile image of a developer in a sophisticated dark-mode office environment. The lighting is soft and diffused, with cyan and indigo accent lights reflecting off glass surfaces. The style is ultra-modern and technical, emphasizing a clean, systematic appearance that integrates perfectly with a high-density financial application UI."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuCB2xzhodQVM_EwB3wPB3dJGwLwR59XFXDgqn-ogFyWiY_OJ_HUaHileCL8nHkzQdsa_uO9ulvakXS3lzYldmGSWQW4nsYoWLoquf9mt_u_aBt_o32CUZzOl7SGXcUPTUS9gAhF8niYCNo6xtW0UYp4A447XcqTHGljFmwuOCSmfwI3czNrFiXMfqqJ0gWtXZMf71Y7Tm_QajNnlqPZyNGvV1DwcWs5S11Km6mnUbPGGQf3M96ghhVfmw"
            />
          </div>
          <button
            class="bg-secondary-container text-on-secondary-container border-surface absolute right-0 bottom-0 flex items-center justify-center rounded-full border-2 p-1.5"
          >
            <span class="material-symbols-outlined text-[18px]">edit</span>
          </button>
        </div>
        <div class="text-center">
          <h2 class="font-headline-sm text-headline-sm text-on-surface">
            Alex Rivera
          </h2>
          <p class="font-label-md text-label-md text-on-surface-variant">
            alex.rivera@stitchbilling.io
          </p>
        </div>
      </section>
      <!-- Profile Settings Group -->
      <div class="flex flex-col gap-2">
        <h3 class="font-label-md text-label-md text-primary px-1">Profile</h3>
        <div class="settings-card flex flex-col overflow-hidden rounded-xl">
          <button
            class="hover:bg-surface-variant flex items-center justify-between p-4 transition-colors duration-200"
          >
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-on-surface-variant"
                >person</span
              >
              <span class="font-body-md text-body-md"
                >Personal Information</span
              >
            </div>
            <span class="material-symbols-outlined text-on-surface-variant"
              >chevron_right</span
            >
          </button>
          <div class="bg-outline-variant mx-4 h-[1px]"></div>
          <button
            class="hover:bg-surface-variant flex items-center justify-between p-4 transition-colors duration-200"
          >
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-on-surface-variant"
                >security</span
              >
              <span class="font-body-md text-body-md">Login & Security</span>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant"
              >chevron_right</span
            >
          </button>
        </div>
      </div>
      <!-- Billing Settings Group -->
      <div class="flex flex-col gap-2">
        <h3 class="font-label-md text-label-md text-primary px-1">Billing</h3>
        <div class="settings-card flex flex-col overflow-hidden rounded-xl">
          <button
            class="hover:bg-surface-variant flex items-center justify-between p-4 transition-colors duration-200"
          >
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-on-surface-variant"
                >payments</span
              >
              <span class="font-body-md text-body-md">Payment Methods</span>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant"
              >chevron_right</span
            >
          </button>
          <div class="bg-outline-variant mx-4 h-[1px]"></div>
          <button
            class="hover:bg-surface-variant flex items-center justify-between p-4 transition-colors duration-200"
          >
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-on-surface-variant"
                >receipt_long</span
              >
              <span class="font-body-md text-body-md">Billing History</span>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant"
              >chevron_right</span
            >
          </button>
          <div class="bg-outline-variant mx-4 h-[1px]"></div>
          <button
            class="hover:bg-surface-variant flex items-center justify-between p-4 transition-colors duration-200"
          >
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-on-surface-variant"
                >description</span
              >
              <span class="font-body-md text-body-md">Tax Documents</span>
            </div>
            <span class="material-symbols-outlined text-on-surface-variant"
              >chevron_right</span
            >
          </button>
        </div>
      </div>
      <!-- System Preferences Group -->
      <div class="flex flex-col gap-2">
        <h3 class="font-label-md text-label-md text-primary px-1">System</h3>
        <div class="settings-card flex flex-col overflow-hidden rounded-xl">
          <button
            class="hover:bg-surface-variant flex items-center justify-between p-4 transition-colors duration-200"
          >
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-on-surface-variant"
                >notifications</span
              >
              <span class="font-body-md text-body-md"
                >Notification Preferences</span
              >
            </div>
            <span class="material-symbols-outlined text-on-surface-variant"
              >chevron_right</span
            >
          </button>
          <div class="bg-outline-variant mx-4 h-[1px]"></div>
          <button
            class="hover:bg-surface-variant flex items-center justify-between p-4 transition-colors duration-200"
          >
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-on-surface-variant"
                >palette</span
              >
              <span class="font-body-md text-body-md">Theme & Display</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-mono-sm text-mono-sm text-outline">Dark</span>
              <span class="material-symbols-outlined text-on-surface-variant"
                >chevron_right</span
              >
            </div>
          </button>
          <div class="bg-outline-variant mx-4 h-[1px]"></div>
          <button
            class="hover:bg-surface-variant flex items-center justify-between p-4 transition-colors duration-200"
          >
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-on-surface-variant"
                >language</span
              >
              <span class="font-body-md text-body-md">Language</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-mono-sm text-mono-sm text-outline"
                >English (US)</span
              >
              <span class="material-symbols-outlined text-on-surface-variant"
                >chevron_right</span
              >
            </div>
          </button>
        </div>
      </div>
      <!-- Logout Action -->
      <button
        class="border-error-container text-error hover:bg-error-container/10 mt-4 flex items-center justify-center gap-2 rounded-xl border p-4 transition-colors duration-200"
      >
        <span class="material-symbols-outlined">logout</span>
        <span class="font-label-md text-label-md">Sign Out</span>
      </button>
    </main>
    <!-- BottomNavBar -->
    <nav
      class="pb-safe bg-surface border-outline-variant fixed bottom-0 left-0 z-50 flex h-16 w-full items-center justify-around border-t px-2"
    >
      <button
        class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high flex flex-1 flex-col items-center justify-center transition-transform duration-100 active:scale-95"
      >
        <span class="material-symbols-outlined">dashboard</span>
        <span class="font-label-md text-label-md">Dashboard</span>
      </button>
      <button
        class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high flex flex-1 flex-col items-center justify-center transition-transform duration-100 active:scale-95"
      >
        <span class="material-symbols-outlined">receipt_long</span>
        <span class="font-label-md text-label-md">Invoices</span>
      </button>
      <button
        class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high flex flex-1 flex-col items-center justify-center transition-transform duration-100 active:scale-95"
      >
        <span class="material-symbols-outlined">group</span>
        <span class="font-label-md text-label-md">Customers</span>
      </button>
      <button
        class="text-primary-container dark:text-primary-container relative flex flex-1 flex-col items-center justify-center font-bold transition-transform duration-100 active:scale-95"
      >
        <span
          class="material-symbols-outlined"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >settings</span
        >
        <span class="font-label-md text-label-md">Settings</span>
        <div class="active-nav-indicator bg-primary-container"></div>
      </button>
    </nav>
    <script>
      // Micro-interactions for settings rows
      document.querySelectorAll(".settings-card button").forEach((button) => {
        button.addEventListener("mousedown", () => {
          button.style.transform = "scale(0.98)";
          button.style.transition = "transform 0.1s ease";
        });
        button.addEventListener("mouseup", () => {
          button.style.transform = "scale(1)";
        });
        button.addEventListener("mouseleave", () => {
          button.style.transform = "scale(1)";
        });
      });
    </script>
  </body>
</html>
