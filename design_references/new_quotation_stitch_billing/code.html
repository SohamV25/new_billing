<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      name="viewport"
    />
    <title>New Quotation - Stitch Billing</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      /* Custom scrollbar for high-density UI */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #131314;
      }
      ::-webkit-scrollbar-thumb {
        background: #2d2f34;
        border-radius: 2px;
      }
      .glass-panel {
        background: rgba(30, 31, 34, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid #2d2f34;
      }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              secondary: "#adc7ff",
              "tertiary-fixed-dim": "#a7d0b3",
              "on-tertiary-container": "#274c36",
              "surface-container-high": "#2a2a2b",
              surface: "#131314",
              "tertiary-container": "#94bca0",
              "on-secondary-fixed-variant": "#004493",
              "surface-container-lowest": "#0e0e0f",
              "on-primary-container": "#0d4582",
              "surface-container": "#201f20",
              "outline-variant": "#424750",
              "secondary-container": "#026be0",
              "primary-fixed-dim": "#a8c8ff",
              background: "#131314",
              "on-primary-fixed-variant": "#114784",
              "inverse-on-surface": "#313031",
              "on-secondary-container": "#f2f4ff",
              "on-primary-fixed": "#001b3c",
              "surface-container-highest": "#353436",
              "on-primary": "#003061",
              "secondary-fixed-dim": "#adc7ff",
              "on-surface": "#e5e2e3",
              "on-error": "#690005",
              "tertiary-fixed": "#c3edcf",
              "primary-container": "#8ab4f8",
              "surface-container-low": "#1c1b1c",
              "on-error-container": "#ffdad6",
              "inverse-primary": "#315f9d",
              "on-secondary-fixed": "#001a41",
              "error-container": "#93000a",
              tertiary: "#afd8bb",
              "primary-fixed": "#d5e3ff",
              "surface-tint": "#a8c8ff",
              "surface-bright": "#39393a",
              "secondary-fixed": "#d8e2ff",
              "surface-variant": "#353436",
              outline: "#8d919b",
              error: "#ffb4ab",
              "on-tertiary-fixed-variant": "#294e38",
              "surface-dim": "#131314",
              "on-secondary": "#002e68",
              "on-surface-variant": "#c3c6d1",
              "on-tertiary": "#113723",
              "inverse-surface": "#e5e2e3",
              primary: "#b5cfff",
              "on-background": "#e5e2e3",
              "on-tertiary-fixed": "#002110",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              unit: "4px",
              "container-padding": "24px",
              "margin-mobile": "16px",
              "margin-desktop": "32px",
              gutter: "16px",
            },
            fontFamily: {
              "body-md": ["Inter"],
              "headline-md": ["Inter"],
              "label-md": ["Geist"],
              "headline-sm": ["Inter"],
              "body-lg": ["Inter"],
              "mono-sm": ["Geist"],
              "headline-lg": ["Inter"],
            },
            fontSize: {
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-md": [
                "24px",
                {
                  lineHeight: "32px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.02em",
                  fontWeight: "500",
                },
              ],
              "headline-sm": [
                "20px",
                { lineHeight: "28px", fontWeight: "500" },
              ],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "mono-sm": ["12px", { lineHeight: "18px", fontWeight: "400" }],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.02em",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-surface text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container"
  >
    <!-- TopAppBar -->
    <header
      class="px-margin-mobile bg-surface border-outline-variant fixed top-0 z-50 flex h-16 w-full items-center justify-between border-b"
    >
      <div class="flex items-center gap-3">
        <button
          class="hover:bg-surface-variant flex h-10 w-10 items-center justify-center rounded-full transition-colors duration-200"
        >
          <span class="material-symbols-outlined text-on-surface-variant"
            >close</span
          >
        </button>
        <h1 class="font-headline-sm text-headline-sm text-on-surface">
          New Quotation
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <span
          class="font-label-md text-label-md text-on-surface-variant bg-surface-container-high border-outline-variant rounded border px-2 py-1"
          >DRAFT</span
        >
      </div>
    </header>
    <main
      class="px-margin-mobile mx-auto flex max-w-lg flex-col gap-6 pt-20 pb-32"
    >
      <!-- Header Visual / Context -->
      <section class="flex flex-col gap-2">
        <div class="text-primary-container flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">request_quote</span>
          <span class="font-label-md text-label-md tracking-wider uppercase"
            >Quotation Builder</span
          >
        </div>
        <p class="text-on-surface-variant font-body-md">
          Create a detailed estimate for your customer. Valid for the duration
          specified below.
        </p>
      </section>
      <!-- Customer & Validity Info -->
      <div
        class="bg-surface-container border-outline-variant flex flex-col gap-4 rounded-xl border p-6"
      >
        <div>
          <label
            class="font-label-md text-label-md text-on-surface-variant mb-2 block"
            >Customer</label
          >
          <div class="group relative">
            <input
              class="bg-surface-container-low border-outline-variant text-on-surface focus:border-primary-container h-12 w-full rounded-lg border px-4 transition-all focus:outline-none"
              placeholder="Select customer..."
              type="text"
            />
            <span
              class="material-symbols-outlined text-on-surface-variant absolute top-3 right-4"
              >expand_more</span
            >
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label
              class="font-label-md text-label-md text-on-surface-variant mb-2 block"
              >Quotation Date</label
            >
            <input
              class="bg-surface-container-low border-outline-variant text-on-surface focus:border-primary-container h-12 w-full rounded-lg border px-4 transition-all focus:outline-none"
              type="date"
              value="2023-10-27"
            />
          </div>
          <div>
            <label
              class="font-label-md text-label-md text-on-surface-variant mb-2 block"
              >Validity Date</label
            >
            <input
              class="bg-surface-container-low border-outline-variant text-on-surface focus:border-primary-container h-12 w-full rounded-lg border px-4 transition-all focus:outline-none"
              type="date"
            />
          </div>
        </div>
      </div>
      <!-- Line Items -->
      <section class="flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <h2 class="font-headline-sm text-headline-sm text-on-surface">
            Items
          </h2>
          <button
            class="text-primary-container font-label-md text-label-md flex items-center gap-1 hover:underline"
          >
            <span class="material-symbols-outlined text-sm">add</span> Add Item
          </button>
        </div>
        <!-- Bento-style Item Cards -->
        <div class="flex flex-col gap-3">
          <!-- Item 1 -->
          <div
            class="border-outline-variant bg-surface-container-low group relative flex flex-col gap-3 overflow-hidden rounded-xl border p-4"
          >
            <div class="flex items-start justify-between">
              <div class="mr-8 flex w-full flex-col gap-1">
                <input
                  class="font-body-lg text-body-lg text-on-surface placeholder:text-outline border-none bg-transparent p-0 focus:ring-0"
                  placeholder="Item name"
                  type="text"
                  value="Cloud Hosting - Enterprise"
                />
                <input
                  class="font-body-md text-body-md text-on-surface-variant placeholder:text-outline border-none bg-transparent p-0 focus:ring-0"
                  placeholder="Description"
                  type="text"
                  value="Managed Kubernetes cluster, 3 nodes"
                />
              </div>
              <button
                class="text-on-surface-variant hover:text-error transition-colors"
              >
                <span class="material-symbols-outlined">delete</span>
              </button>
            </div>
            <div
              class="border-outline-variant/30 flex items-end justify-between border-t pt-3"
            >
              <div class="flex items-center gap-4">
                <div class="flex flex-col">
                  <span class="text-outline text-[10px] font-bold uppercase"
                    >Qty</span
                  >
                  <input
                    class="font-mono-sm text-mono-sm text-primary-container w-12 border-none bg-transparent p-0 focus:ring-0"
                    type="number"
                    value="1"
                  />
                </div>
                <div class="flex flex-col">
                  <span class="text-outline text-[10px] font-bold uppercase"
                    >Price</span
                  >
                  <input
                    class="font-mono-sm text-mono-sm text-on-surface w-20 border-none bg-transparent p-0 focus:ring-0"
                    type="text"
                    value="$450.00"
                  />
                </div>
              </div>
              <span class="font-mono-sm text-on-surface font-bold"
                >$450.00</span
              >
            </div>
          </div>
          <!-- Item 2 -->
          <div
            class="border-outline-variant bg-surface-container-low flex flex-col gap-3 rounded-xl border p-4"
          >
            <div class="flex items-start justify-between">
              <div class="mr-8 flex w-full flex-col gap-1">
                <input
                  class="font-body-lg text-body-lg text-on-surface border-none bg-transparent p-0 focus:ring-0"
                  placeholder="Item name"
                  type="text"
                  value="Support Retainer"
                />
                <input
                  class="font-body-md text-body-md text-on-surface-variant border-none bg-transparent p-0 focus:ring-0"
                  placeholder="Description"
                  type="text"
                  value="24/7 Priority support, 10h/mo"
                />
              </div>
              <button class="text-on-surface-variant">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </div>
            <div
              class="border-outline-variant/30 flex items-end justify-between border-t pt-3"
            >
              <div class="flex items-center gap-4">
                <div class="flex flex-col">
                  <span class="text-outline text-[10px] font-bold uppercase"
                    >Qty</span
                  >
                  <input
                    class="font-mono-sm text-mono-sm text-primary-container w-12 border-none bg-transparent p-0 focus:ring-0"
                    type="number"
                    value="1"
                  />
                </div>
                <div class="flex flex-col">
                  <span class="text-outline text-[10px] font-bold uppercase"
                    >Price</span
                  >
                  <input
                    class="font-mono-sm text-mono-sm text-on-surface w-20 border-none bg-transparent p-0 focus:ring-0"
                    type="text"
                    value="$200.00"
                  />
                </div>
              </div>
              <span class="font-mono-sm text-on-surface font-bold"
                >$200.00</span
              >
            </div>
          </div>
        </div>
      </section>
      <!-- Summary -->
      <section
        class="bg-surface-container-high border-outline-variant flex flex-col gap-3 rounded-xl border border-dashed p-6"
      >
        <div class="text-body-md text-on-surface-variant flex justify-between">
          <span>Subtotal</span>
          <span class="font-mono-sm">$650.00</span>
        </div>
        <div class="text-body-md text-on-surface-variant flex justify-between">
          <span>Tax (10%)</span>
          <span class="font-mono-sm">$65.00</span>
        </div>
        <div class="bg-outline-variant my-1 h-px"></div>
        <div
          class="text-headline-sm text-on-surface flex justify-between font-bold"
        >
          <span>Total Amount</span>
          <span class="font-mono-sm text-primary">$715.00</span>
        </div>
      </section>
      <!-- Notes -->
      <section>
        <label
          class="font-label-md text-label-md text-on-surface-variant mb-2 block"
          >Notes & Terms</label
        >
        <textarea
          class="bg-surface-container border-outline-variant text-on-surface focus:border-primary-container h-24 w-full resize-none rounded-lg border p-4 transition-all focus:outline-none"
          placeholder="Specify any additional terms..."
        ></textarea>
      </section>
    </main>
    <!-- Bottom Actions Layer -->
    <div
      class="p-margin-mobile glass-panel fixed bottom-0 left-0 z-50 w-full border-t-0"
    >
      <div class="mx-auto flex max-w-lg gap-3">
        <button
          class="border-outline-variant text-on-surface font-label-md text-label-md flex h-14 flex-1 items-center justify-center gap-2 rounded-xl border transition-transform active:scale-95"
        >
          <span class="material-symbols-outlined">save</span> Save Draft
        </button>
        <button
          class="font-label-md text-label-md flex h-14 flex-[2] items-center justify-center gap-2 rounded-xl bg-[#1A73E8] text-white shadow-lg shadow-blue-900/20 transition-transform active:scale-95"
        >
          <span
            class="material-symbols-outlined"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >send</span
          >
          Send Quotation
        </button>
      </div>
    </div>
    <!-- Floating Atmosphere Elements -->
    <div
      class="bg-primary-container/5 pointer-events-none fixed top-1/4 -right-20 z-0 h-64 w-64 rounded-full blur-[100px]"
    ></div>
    <div
      class="bg-secondary-container/5 pointer-events-none fixed bottom-1/4 -left-20 z-0 h-64 w-64 rounded-full blur-[100px]"
    ></div>
    <script>
      // Simple micro-interaction for input highlighting
      document.querySelectorAll("input, textarea").forEach((el) => {
        el.addEventListener("focus", () => {
          el.closest(".rounded-xl")?.classList.add(
            "ring-1",
            "ring-primary-container/20"
          );
        });
        el.addEventListener("blur", () => {
          el.closest(".rounded-xl")?.classList.remove(
            "ring-1",
            "ring-primary-container/20"
          );
        });
      });
    </script>
  </body>
</html>
